services:
  - type: web
    name: foodbridge
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn foodbridge.wsgi:application --workers 2 --threads 4 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: foodbridge-db
          property: connectionString
      - key: RENDER_EXTERNAL_HOSTNAME
        fromService:
          type: web
          name: foodbridge
          property: host
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: GOOGLE_MAPS_BROWSER_API_KEY
        sync: false
      - key: GOOGLE_MAPS_SERVER_API_KEY
        sync: false

databases:
  - name: foodbridge-db
    databaseName: foodbridge
    user: foodbridge
